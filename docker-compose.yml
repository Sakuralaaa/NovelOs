services:
  novelos:
    build: .
    image: novelos:latest
    container_name: novelos
    ports:
      - "${APP_PORT:-8080}:8000"
    volumes:
      - ./data:/data
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 可选：API Key 加密主密钥。留空则首次启动自动生成并保存在 ./data/secret.key
      NOVELOS_SECRET: ${NOVELOS_SECRET:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
